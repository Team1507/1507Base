# Builds the robot code and runs the unit tests on every push and pull request.
# The tests include SwerveConfigTest, NodeBoundsTest and CommandsV3PatternsTest,
# so a bad Tuner X paste, an out-of-bounds node, or a Commands v3 behavior
# change fails here before anyone deploys.
name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WPILib 2027 uses Java 25
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/
